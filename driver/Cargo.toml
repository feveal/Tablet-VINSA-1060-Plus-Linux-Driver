[package]
name = "v1060p"
version = "3.0.2"
edition = "2024"

[dependencies]
evdev = "0.12.1"
rusb = "0.9.3"
ctrlc = "3.4"
winit = "0.29"
# default-features = false: evita libxdo (solo se usa para los elementos de menú
# predefinidos Copiar/Pegar). Sin esto la compilación falla si falta libxdo-dev.
tray-icon = { version = "0.19", default-features = false }
gtk = "0.18"
gettext-rs = "0.8"
resvg = "0.43"
usvg = "0.43"
xkbcommon = "0.7"

[profile.release]
strip = true
lto = true
panic = "abort"
